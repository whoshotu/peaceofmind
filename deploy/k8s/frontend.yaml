apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: peaceofmind
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: peaceofmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: peaceofmind
    spec:
      containers:
        - name: frontend
          image: peaceofmind-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: peaceofmind
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: peaceofmind
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
